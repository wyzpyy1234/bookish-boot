spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://localhost:3306/bookish_db?serverTimezone=GMT%2B8&useSSL=false&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5
      max-active: 20
      min-idle: 5
  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 2MB
mybatis:
  type-aliases-package: com.ithw.pojo
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 业务自定义配置
bookish-boot:
  upload:
    dir: ./uploads
  # 管理员注册邀请码：线上用环境变量 ADMIN_INVITE_CODE 覆盖即可，不用改代码
  admin-invite-code: ${ADMIN_INVITE_CODE:bookish-admin-2026}
