<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>登录 · Bookish 图书借阅系统</title>
<link rel="stylesheet" href="css/style.css?v=20261019a">
</head>
<body>

<div class="login-page">

  <!-- ============ 左侧品牌区（大屏显示） ============ -->
  <aside class="login-aside">
    <div class="la-brand"><span class="sb-logo">📚</span>Bookish</div>

    <div class="la-mid">
      <h2>让每一本书<br>都被准确找到</h2>
      <p>馆藏检索、在线借还、到期提醒、交流论坛 —— 一体化的图书馆借阅管理系统。</p>
      <div class="la-feats">
        <div class="la-feat"><i>🔍</i>三表联查 + 分页的动态检索</div>
        <div class="la-feat"><i>📚</i>按副本管理的真实借还流程</div>
        <div class="la-feat"><i>💬</i>读者与管理员共建的交流论坛</div>
        <div class="la-feat"><i>📊</i>借阅数据看板与索引优化实践</div>
      </div>
    </div>

    <div class="la-foot">Bookish · Spring Boot + MyBatis + MySQL 练手项目</div>
  </aside>

  <!-- ============ 右侧表单区 ============ -->
  <main class="login-main">
    <div class="login-box">
      <div class="login-logo">
        <div class="sb-logo">📚</div>
        <div><b style="font-size:15px">Bookish</b><div class="text-xs text-light">图书借阅管理系统</div></div>
      </div>

      <h1 id="pageTitle">欢迎回来</h1>
      <div class="subtitle" id="pageSub">登录后即可检索馆藏、借阅图书</div>

      <div class="login-tabs">
        <button id="tabLogin" class="active" onclick="switchTab('login')">登录</button>
        <button id="tabReg" onclick="switchTab('reg')">注册</button>
      </div>

      <!-- 登录表单 -->
      <form id="loginForm" onsubmit="doLogin(event)">
        <div class="field">
          <label>账号</label>
          <input type="text" id="loginUsername" placeholder="请输入账号" autocomplete="username" required>
        </div>
        <div class="field">
          <label>密码</label>
          <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="btnLogin">登 录</button>
      </form>

      <!-- 注册表单 -->
      <form id="regForm" class="hidden" onsubmit="doRegister(event)">
        <div class="field">
          <label>账号</label>
          <input type="text" id="regUsername" placeholder="登录用的账号，建议英文" required>
        </div>
        <div class="field">
          <label>密码</label>
          <input type="password" id="regPassword" placeholder="至少 6 位" required>
        </div>
        <div class="field">
          <label>姓名 / 昵称</label>
          <input type="text" id="regNickname" placeholder="显示用的名字" required>
        </div>
        <div class="field">
          <label>手机号（选填）</label>
          <input type="text" id="regPhone" placeholder="11 位手机号">
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="btnReg">注 册</button>
      </form>

      <div class="login-tip">
        <b>演示账号</b>（密码统一 <b>123456</b>）：
        <div class="lt-copy">
          <button type="button" onclick="fillDemo('admin')">管理员 admin</button>
          <button type="button" onclick="fillDemo('zhangsan')">读者 zhangsan</button>
          <button type="button" onclick="fillDemo('lisi')">读者 lisi</button>
          <button type="button" onclick="fillDemo('wangwu')">已禁言 wangwu</button>
        </div>
        <div class="mt-8" style="color:var(--text-3)">
          点按钮即填充账号密码 · 多账号同时在线请 Ctrl+T 新开标签页
        </div>
      </div>
    </div>
  </main>

</div>

<script src="js/mock.js?v=20261019a"></script>
<script src="js/api.js?v=20261019a"></script>
<script src="js/login.js?v=20261019a"></script>
</body>
</html>
