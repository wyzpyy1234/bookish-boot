<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>登录 · Bookish 图书借阅系统</title>
<link rel="stylesheet" href="css/style.css?v=20261019j">
</head>
<body>

<div class="login-page">

  <!-- ============ 左侧品牌区（大屏显示） ============ -->
  <aside class="login-aside">
    <div class="la-brand"><span class="sb-logo">📚</span>Bookish</div>

    <div class="la-mid">
      <div class="la-eyebrow">图书馆借阅管理系统</div>
      <h2>让每一本书<br>都被准确找到</h2>
      <p>从检索馆藏到在线借还，从到期提醒到读后交流 —— 一本书的整个旅程，都在这里完成。</p>
      <div class="la-feats">
        <div class="la-feat"><i>🔍</i><div><b>动态检索</b><span>三表联查 + 分页</span></div></div>
        <div class="la-feat"><i>📚</i><div><b>真实借还</b><span>按副本管理库存</span></div></div>
        <div class="la-feat"><i>💬</i><div><b>交流论坛</b><span>读者与管理员共建</span></div></div>
        <div class="la-feat"><i>📊</i><div><b>数据看板</b><span>借阅趋势与排行</span></div></div>
      </div>
    </div>

    <div class="la-foot">
      <span>© 2026 Bookish</span>
      <span>馆藏 · 借阅 · 交流</span>
    </div>
  </aside>

  <!-- ============ 右侧表单区 ============ -->
  <main class="login-main">
    <div class="login-box">
      <div class="login-logo">
        <div class="sb-logo">📚</div>
        <div><b style="font-size:15px">Bookish</b><div class="text-xs text-light">图书借阅管理系统</div></div>
      </div>

      <h1 id="pageTitle">欢迎回来</h1>
      <div class="subtitle" id="pageSub">登录后即可检索馆藏、借阅图书</div>

      <div class="login-tabs">
        <button id="tabLogin" class="active" onclick="switchTab('login')">登录</button>
        <button id="tabReg" onclick="switchTab('reg')">注册</button>
      </div>

      <!-- 登录表单 -->
      <form id="loginForm" onsubmit="doLogin(event)">
        <div class="field">
          <label>账号</label>
          <input type="text" id="loginUsername" placeholder="请输入账号" autocomplete="username" required>
        </div>
        <div class="field">
          <label>密码</label>
          <div class="pwd-wrap">
            <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password" required>
            <button type="button" class="pwd-eye" onclick="togglePwd('loginPassword', this)" aria-label="显示密码" tabindex="-1">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="btnLogin">登 录</button>
      </form>

      <!-- 注册表单 -->
      <form id="regForm" class="hidden" onsubmit="doRegister(event)">
        <div class="field">
          <label>账号</label>
          <input type="text" id="regUsername" placeholder="登录用的账号，建议英文" required>
        </div>
        <div class="field">
          <label>密码</label>
          <div class="pwd-wrap">
            <input type="password" id="regPassword" placeholder="至少 6 位" autocomplete="new-password" required>
            <button type="button" class="pwd-eye" onclick="togglePwd('regPassword', this)" aria-label="显示密码" tabindex="-1">👁</button>
          </div>
        </div>
        <div class="field">
          <label>姓名 / 昵称</label>
          <input type="text" id="regNickname" placeholder="显示用的名字" required>
        </div>
        <div class="field">
          <label>手机号（选填）</label>
          <input type="text" id="regPhone" placeholder="11 位手机号">
        </div>
        <div class="field">
          <label>注册身份</label>
          <select id="regRole" onchange="onRegRoleChange()">
            <option value="reader">读者 · 借书 / 发帖</option>
            <option value="admin">管理员 · 需邀请码</option>
          </select>
        </div>
        <div class="field hidden" id="regInviteBox">
          <label>管理员邀请码</label>
          <div class="pwd-wrap">
            <input type="password" id="regInviteCode" placeholder="向站长索取，没有就保持“读者”" autocomplete="off">
            <button type="button" class="pwd-eye" onclick="togglePwd('regInviteCode', this)" aria-label="显示邀请码" tabindex="-1">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="btnReg">注 册</button>
      </form>
    </div>
  </main>

</div>

<script src="js/mock.js?v=20261019j"></script>
<script src="js/api.js?v=20261019j"></script>
<script src="js/login.js?v=20261019j"></script>
</body>
</html>
