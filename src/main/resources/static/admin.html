<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>管理后台 · Bookish</title>
<link rel="stylesheet" href="css/style.css?v=20261019l">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">

      <div class="tabs">
        <button class="active" onclick="switchPane('stats', this)">📊 统计看板</button>
        <button onclick="switchPane('books', this)">📚 图书管理</button>
        <button onclick="switchPane('records', this)">📋 借阅流水</button>
        <span class="t-spacer"></span>
        <a class="btn btn-ghost btn-sm" href="community.html">🛡️ 社区管理 ↗</a>
      </div>

      <!-- ==================== 统计看板 ==================== -->
      <div id="paneStats">
        <div class="stat-grid cols-4">
          <div class="stat-card">
            <div class="s-top"><span class="s-label">图书种类</span><span class="s-ico">📚</span></div>
            <div class="s-value" id="stBooks">—</div>
          </div>
          <div class="stat-card">
            <div class="s-top"><span class="s-label">馆藏册数</span><span class="s-ico">🗂️</span></div>
            <div class="s-value" id="stCopies">—</div>
          </div>
          <div class="stat-card">
            <div class="s-top"><span class="s-label">注册读者</span><span class="s-ico">👥</span></div>
            <div class="s-value" id="stReaders">—</div>
          </div>
          <div class="stat-card">
            <div class="s-top"><span class="s-label">当前在借</span><span class="s-ico">📖</span></div>
            <div class="s-value" id="stBorrowing">—</div>
          </div>
          <div class="stat-card danger">
            <div class="s-top"><span class="s-label">逾期未还</span><span class="s-ico">⏰</span></div>
            <div class="s-value" id="stOverdue">—</div>
          </div>
          <div class="stat-card">
            <div class="s-top"><span class="s-label">今日借出</span><span class="s-ico">📈</span></div>
            <div class="s-value" id="stToday">—</div>
          </div>
          <div class="stat-card accent">
            <div class="s-top"><span class="s-label">待缴罚款</span><span class="s-ico">💰</span></div>
            <div class="s-value" id="stFine">—</div>
          </div>
          <div class="stat-card success">
            <div class="s-top"><span class="s-label">论坛帖子</span><span class="s-ico">💬</span></div>
            <div class="s-value" id="stPosts">—</div>
            <div class="s-foot">待处理举报 <b id="stReports">—</b></div>
          </div>
        </div>

        <div class="stat-grid cols-2 mt-16" style="grid-template-columns:1fr 1fr">
          <div class="card">
            <div class="card-head"><h3>📊 各分类借阅量</h3></div>
            <div class="card-body"><div class="bar-chart" id="catChart"><div class="loading-tip">加载中…</div></div></div>
          </div>
          <div class="card">
            <div class="card-head"><h3>📈 月度借出趋势</h3></div>
            <div class="card-body"><div class="bar-chart" id="monthChart"><div class="loading-tip">加载中…</div></div></div>
          </div>
        </div>
      </div>

      <!-- ==================== 图书管理 ==================== -->
      <div id="paneBooks" class="hidden">
        <div class="flex-between mb-16">
          <div class="text-sub text-sm">共 <b id="bookTotal">0</b> 种图书（含全部出版社）</div>
          <button class="btn btn-primary" onclick="openBookForm(null)">＋ 新增图书</button>
        </div>
        <div class="table-wrap"><table class="data-table" id="bookTable"></table></div>
        <div id="bookPager" class="pager"></div>
      </div>

      <!-- ==================== 借阅流水 ==================== -->
      <div id="paneRecords" class="hidden">
        <div class="card mb-16">
          <div class="card-body" style="padding:14px 16px">
            <div class="search-row">
              <div class="search-wrap">
                <span class="s-ico">🔍</span>
                <input type="text" id="recKeyword" placeholder="搜索读者姓名 / 书名 / 条码…"
                       onkeydown="if(event.key==='Enter')loadRecords(1)">
              </div>
              <select id="recStatus" onchange="loadRecords(1)" style="width:auto;min-width:130px">
                <option value="">全部状态</option>
                <option value="borrowed">在借中</option>
                <option value="overdue">已逾期</option>
                <option value="returned">已归还</option>
              </select>
              <button class="btn btn-primary" onclick="loadRecords(1)">查询</button>
              <button class="btn btn-ghost" onclick="resetRecords()">重置</button>
            </div>
          </div>
        </div>
        <div class="table-wrap"><table class="data-table" id="recTable"></table></div>
        <div id="recPager" class="pager"></div>
      </div>

    </main>
  </div>
</div>

<!-- ==================== 图书新增/编辑弹窗 ==================== -->
<div class="modal-mask" id="bookModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="bookModalTitle">新增图书</h3>
      <button class="modal-close" onclick="closeModal('bookModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>书名 *</label>
        <input type="text" id="fTitle" placeholder="例如：深入理解计算机系统">
      </div>
      <div class="field-row">
        <div class="field"><label>作者 *</label><input type="text" id="fAuthor" placeholder="作者姓名"></div>
        <div class="field"><label>ISBN *</label><input type="text" id="fIsbn" placeholder="13 位书号"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>分类 *</label><select id="fCategory"></select></div>
        <div class="field"><label>出版社 *</label><select id="fPublisher"></select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>价格（元）*</label><input type="number" id="fPrice" step="0.01" min="0" placeholder="59.00"></div>
        <div class="field"><label>出版日期</label><input type="date" id="fDate"></div>
      </div>
      <div class="field" id="copyCountField">
        <label>初始副本数 *</label>
        <input type="number" id="fCopyCount" min="1" max="20" value="3">
        <div class="hint">同一本书可以有多本实体副本，副本会自动生成唯一条码</div>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>简介</label>
        <textarea id="fIntro" placeholder="一句话介绍这本书"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal('bookModal')">取消</button>
      <button class="btn btn-primary" id="btnSaveBook" onclick="saveBook()">保存</button>
    </div>
  </div>
</div>

<script src="js/mock.js?v=20261019l"></script>
<script src="js/api.js?v=20261019l"></script>
<script src="js/admin.js?v=20261019l"></script>
</body>
</html>
