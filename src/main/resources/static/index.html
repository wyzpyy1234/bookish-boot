<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>图书检索 · Bookish</title>
<link rel="stylesheet" href="css/style.css?v=20261019a">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">

      <!-- ============ 我的借阅概览 ============ -->
      <div class="stat-grid">
        <div class="stat-card">
          <div class="s-top"><span class="s-label">当前在借</span><span class="s-ico">📖</span></div>
          <div class="s-value" id="statBorrowing">—</div>
          <div class="s-foot">可借上限 <b id="statMax">—</b></div>
        </div>
        <div class="stat-card danger">
          <div class="s-top"><span class="s-label">已逾期</span><span class="s-ico">⏰</span></div>
          <div class="s-value" id="statOverdue">—</div>
          <div class="s-foot">逾期后无法续借</div>
        </div>
        <div class="stat-card success">
          <div class="s-top"><span class="s-label">已归还</span><span class="s-ico">✅</span></div>
          <div class="s-value" id="statReturned">—</div>
          <div class="s-foot">历史累计</div>
        </div>
        <div class="stat-card accent">
          <div class="s-top"><span class="s-label">待缴罚款</span><span class="s-ico">💰</span></div>
          <div class="s-value" id="statFine">—</div>
          <div class="s-foot">0.5 元/天，单本上限 20 元</div>
        </div>
      </div>

      <!-- ============ 热门借阅 TOP10 ============ -->
      <div class="section-title">
        <span class="bar"></span>热门借阅 TOP10
        <span class="sub hot-hint">自动轮播 · 悬停暂停</span>
        <span class="spacer"></span>
        <span class="seg" id="hotToggle">
          <button type="button" class="seg-btn" data-mode="carousel" onclick="setHotMode('carousel')">轮换</button>
          <button type="button" class="seg-btn" data-mode="grid" onclick="setHotMode('grid')">平铺</button>
        </span>
      </div>
      <div class="hot-carousel" id="hotCarousel">
        <button class="hot-arrow prev" onclick="hotGo(-1); hotAuto()" aria-label="上一组">‹</button>
        <div class="hot-viewport" id="hotViewport">
          <div class="hot-track" id="hotTrack">
            <div class="hot-placeholder">热门榜加载中…</div>
          </div>
        </div>
        <button class="hot-arrow next" onclick="hotGo(1); hotAuto()" aria-label="下一组">›</button>
        <div class="hot-dots" id="hotDots"></div>
      </div>

      <!-- ============ 图书检索 ============ -->
      <div class="section-title">
        <span class="bar"></span>图书检索
        <span class="sub">支持书名 / 作者关键词，边打边搜</span>
      </div>

      <div class="filter-bar">
        <div class="search-row">
          <div class="search-wrap">
            <span class="s-ico">🔍</span>
            <input type="text" id="keyword" placeholder="输入书名或作者，边打边搜（回车立即搜索）"
                   oninput="onKeywordInput()" onkeydown="onKeywordKey(event)" autocomplete="off">
            <button type="button" class="s-clear" id="kwClear" title="清空" onclick="clearKeyword()">×</button>
          </div>
          <select id="sortSel" onchange="applyFilter()" style="width:auto;min-width:132px">
            <option value="newest">最新上架</option>
            <option value="hot">最多借阅</option>
            <option value="priceAsc">价格从低到高</option>
            <option value="priceDesc">价格从高到低</option>
          </select>
          <select id="pubSel" onchange="applyFilter()" style="width:auto;min-width:150px">
            <option value="">全部出版社</option>
          </select>
          <button class="btn btn-primary" onclick="applyFilter()">搜索</button>
          <span class="search-status" id="searchStatus"></span>
        </div>
        <div class="chips mt-16" id="categoryChips"></div>
        <div class="chips mt-8">
          <span class="chip" id="chipAvailable" onclick="toggleAvailable()">✅ 只看可借</span>
          <span class="chip" onclick="resetFilter()">↺ 重置条件</span>
        </div>
      </div>

      <div id="bookGrid" class="book-grid"></div>
      <div id="pager" class="pager"></div>

    </main>
  </div>
</div>

<!-- ============ 图书详情弹窗 ============ -->
<div class="modal-mask" id="detailModal">
  <div class="modal modal-lg">
    <div class="modal-head">
      <h3>图书详情</h3>
      <button class="modal-close" onclick="closeModal('detailModal')">×</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal('detailModal')">关闭</button>
      <button class="btn btn-primary" id="btnBorrow" onclick="doBorrow()">借这本书</button>
    </div>
  </div>
</div>

<script src="js/mock.js?v=20261019a"></script>
<script src="js/api.js?v=20261019a"></script>
<script src="js/home.js?v=20261019a"></script>
</body>
</html>
