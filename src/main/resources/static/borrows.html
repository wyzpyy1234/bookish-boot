<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>我的借阅 · Bookish</title>
<link rel="stylesheet" href="css/style.css?v=20261019d">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">

      <div class="stat-grid">
        <div class="stat-card">
          <div class="s-top"><span class="s-label">当前在借</span><span class="s-ico">📖</span></div>
          <div class="s-value" id="statBorrowing">—</div>
        </div>
        <div class="stat-card danger">
          <div class="s-top"><span class="s-label">已逾期</span><span class="s-ico">⏰</span></div>
          <div class="s-value" id="statOverdue">—</div>
        </div>
        <div class="stat-card success">
          <div class="s-top"><span class="s-label">已归还</span><span class="s-ico">✅</span></div>
          <div class="s-value" id="statReturned">—</div>
        </div>
        <div class="stat-card accent">
          <div class="s-top"><span class="s-label">待缴罚款</span><span class="s-ico">💰</span></div>
          <div class="s-value" id="statFine">—</div>
        </div>
      </div>

      <div class="tabs mt-24" id="statusTabs">
        <button class="active" data-st="" onclick="pickStatus(this, '')">全部记录</button>
        <button data-st="borrowed" onclick="pickStatus(this, 'borrowed')">在借中</button>
        <button data-st="overdue" onclick="pickStatus(this, 'overdue')">已逾期</button>
        <button data-st="returned" onclick="pickStatus(this, 'returned')">已归还</button>
      </div>

      <div id="borrowList" class="borrow-list"></div>
      <div id="pager" class="pager"></div>

    </main>
  </div>
</div>

<script src="js/mock.js?v=20261019d"></script>
<script src="js/api.js?v=20261019d"></script>
<script src="js/borrows.js?v=20261019d"></script>
</body>
</html>
